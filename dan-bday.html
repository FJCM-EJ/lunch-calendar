<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thanks, Judy!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --board: #2b3a32;
    --ink: #2b2b2b;
    --paper: #faf7f0;
    --muted: #cfd8d0;
    --note-1: #f3b62b;
    --note-2: #e8b4bc;
    --note-3: #8ec5da;
    --note-4: #a8d5ba;
    --note-5: #c9b6e4;
    --note-6: #f2a35c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Work Sans", sans-serif; background: var(--board); min-height: 100vh; color: var(--paper); padding: 0 0 60px; }
  header { text-align: center; padding: 48px 20px 28px; }
  .header-gif { width: 80px; max-width: 40vw; border-radius: 10px; margin: 0 auto 14px; display: block; box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
  h1 { font-family: "Caveat", cursive; font-weight: 700; font-size: clamp(2.6rem, 7vw, 4.2rem); margin: 0; color: var(--paper); text-shadow: 0 2px 0 rgba(0,0,0,0.15); }
  .subtitle { font-size: 0.95rem; color: var(--muted); margin: 10px auto 0; max-width: 440px; line-height: 1.5; }
  .live-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 0.72rem; color: var(--muted); margin-top: 12px; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #6fcf97; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .board { max-width: 1100px; margin: 10px auto 0; padding: 10px 30px 20px; display: flex; flex-wrap: wrap; gap: 26px; justify-content: center; align-items: flex-start; }
  .note { width: 190px; min-height: 170px; padding: 22px 18px 16px; position: relative; font-family: "Caveat", cursive; font-size: 1.3rem; line-height: 1.25; color: var(--ink); box-shadow: 0 8px 16px rgba(0,0,0,.25); transition: transform .25s, box-shadow .25s; cursor: default; }
  .note:hover { transform: rotate(0deg) scale(1.04) !important; box-shadow: 0 14px 22px rgba(0,0,0,.3); z-index: 5; }
  .pin { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); width: 16px; height: 16px; border-radius: 50%; box-shadow: 0 3px 4px rgba(0,0,0,.35), inset -2px -2px 3px rgba(0,0,0,.2), inset 2px 2px 3px rgba(255,255,255,.4); }
  .msg { display: block; margin-bottom: 14px; word-wrap: break-word; }
  .from { position: absolute; bottom: 12px; right: 16px; font-weight: 700; font-size: 1.15rem; }
  .add-card { width: 190px; min-height: 170px; border-radius: 3px; border: 2px dashed rgba(255,255,255,.35); background: rgba(255,255,255,.03); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: pointer; color: var(--muted); font-size: .85rem; transition: background .2s, border-color .2s, transform .2s; }
  .add-card:hover { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.6); transform: translateY(-2px); }
  .plus { font-size: 2.2rem; font-weight: 400; line-height: 1; }
  .empty-msg { color: var(--muted); font-size: .9rem; padding: 20px; text-align: center; width: 100%; }
  .overlay { position: fixed; inset: 0; background: rgba(15,20,17,.8); display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .overlay.open { display: flex; }
  .modal { background: var(--paper); color: var(--ink); width: 100%; max-width: 360px; border-radius: 4px; padding: 26px 24px 22px; box-shadow: 0 20px 50px rgba(0,0,0,.45); }
  .modal h2 { font-family: "Caveat", cursive; font-size: 2rem; margin: 0 0 4px; font-weight: 700; }
  .modal .hint { font-size: .82rem; color: #777; margin: 0 0 18px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: .78rem; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: #6b6b6b; margin-bottom: 6px; }
  .field input, .field textarea { width: 100%; font-family: "Work Sans", sans-serif; font-size: .95rem; padding: 10px 12px; border: 1.5px solid #ddd6c8; border-radius: 3px; background: #fffdf8; color: var(--ink); resize: none; }
  .field textarea { height: 90px; }
  .color-picker { display: flex; gap: 10px; margin-bottom: 18px; }
  .swatch { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; box-shadow: 0 0 0 2px transparent; transition: box-shadow .15s, transform .1s; }
  .swatch:hover { transform: scale(1.1); }
  .swatch.selected { box-shadow: 0 0 0 3px var(--ink); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .btn-cancel { padding: 9px 16px; border: 1.5px solid #ddd; border-radius: 3px; background: none; cursor: pointer; font-family: inherit; font-size: .88rem; color: #666; }
  .btn-pin { padding: 9px 22px; border: none; border-radius: 3px; background: var(--board); color: white; cursor: pointer; font-family: inherit; font-size: .88rem; font-weight: 600; }
  .btn-pin:disabled { opacity: .5; }
  footer { text-align: center; padding-top: 10px; }
  .quiet-link { background: none; border: none; color: rgba(255,255,255,.3); font-size: .75rem; cursor: pointer; font-family: inherit; padding: 6px 14px; border-radius: 4px; transition: color .2s, background .2s; }
  .quiet-link:hover { color: rgba(255,255,255,.65); background: rgba(255,255,255,.06); }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(16px); background: rgba(20,35,28,.95); color: var(--paper); padding: 10px 20px; border-radius: 6px; font-size: .85rem; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; z-index: 100; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .loading-overlay { position: fixed; inset: 0; background: var(--board); display: flex; align-items: center; justify-content: center; z-index: 200; transition: opacity .4s; }
  .loading-overlay.hidden { opacity: 0; pointer-events: none; }
  .spinner { width: 36px; height: 36px; border: 3px solid rgba(255,255,255,.2); border-top-color: #6fcf97; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>

  <h1>Thanks, Judy!</h1>
  <p class="subtitle">Judy treated the whole office to lunch in honor of Dan's birthday. Pin a note to say thanks — everyone can see it!</p>
  <span class="live-badge"><span class="live-dot"></span> Live — notes shared with the whole office</span>
</header>

<div class="board" id="board">
  <p class="empty-msg">Be the first to sign! 🎂</p>
</div>

<footer>
  <button class="quiet-link" id="copyAllBtn">copy all messages for Judy</button>
  <span style="color:rgba(255,255,255,.15);font-size:.7rem;"> · </span>
  <button class="quiet-link" id="exportBtn">download a copy for Judy</button>
</footer>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>Add your note</h2>
    <p class="hint">Pinned to the board for everyone to see.</p>
    <div class="field">
      <label for="nameInput">Your name</label>
      <input type="text" id="nameInput" maxlength="30" placeholder="e.g. Erica">
    </div>
    <div class="field">
      <label for="msgInput">Your message</label>
      <textarea id="msgInput" maxlength="180" placeholder="Thank you for lunch, Judy!"></textarea>
    </div>
    <div class="color-picker" id="colorPicker"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="cancelBtn">Cancel</button>
      <button class="btn-pin" id="submitBtn">Pin it</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAqvUvpjOggFYb6Fa6rX0t7--OhRoPuOQY",
    authDomain: "thanks-judy.firebaseapp.com",
    databaseURL: "https://thanks-judy-default-rtdb.firebaseio.com",
    projectId: "thanks-judy",
    storageBucket: "thanks-judy.firebasestorage.app",
    messagingSenderId: "801072135839",
    appId: "1:801072135839:web:8e913706e8f4173d5f2caa"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);
  const notesRef = ref(db, "notes");

  const noteColors = ["var(--note-1)","var(--note-2)","var(--note-3)","var(--note-4)","var(--note-5)","var(--note-6)"];
  const noteHex    = ["#f3b62b","#e8b4bc","#8ec5da","#a8d5ba","#c9b6e4","#f2a35c"];
  const pinColors  = ["#c0392b","#7f8c8d","#2980b9","#27ae60","#8e44ad","#d35400"];

  let selectedColor = 0;

  const board      = document.getElementById("board");
  const overlay    = document.getElementById("overlay");
  const nameInput  = document.getElementById("nameInput");
  const msgInput   = document.getElementById("msgInput");
  const colorPicker= document.getElementById("colorPicker");
  const submitBtn  = document.getElementById("submitBtn");
  const toast      = document.getElementById("toast");
  const loading    = document.getElementById("loadingOverlay");

  // Color swatches
  noteColors.forEach((c, i) => {
    const sw = document.createElement("div");
    sw.className = "swatch" + (i === 0 ? " selected" : "");
    sw.style.background = c;
    sw.addEventListener("click", () => {
      document.querySelectorAll(".swatch").forEach(s => s.classList.remove("selected"));
      sw.classList.add("selected");
      selectedColor = i;
    });
    colorPicker.appendChild(sw);
  });

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2500);
  }

  function escapeHtml(str) {
    const d = document.createElement("div"); d.textContent = str; return d.innerHTML;
  }

  function renderNote(data) {
    const el = document.createElement("div");
    el.className = "note";
    el.style.background = noteColors[data.colorIndex % noteColors.length];
    el.style.transform = `rotate(${data.rotation || 0}deg)`;
    el.innerHTML = `<div class="pin" style="background:${pinColors[data.colorIndex % pinColors.length]}"></div><span class="msg"></span><span class="from"></span>`;
    el.querySelector(".msg").textContent = data.message;
    el.querySelector(".from").textContent = "— " + data.name;
    return el;
  }

  function buildAddCard() {
    const card = document.createElement("div");
    card.className = "add-card";
    card.innerHTML = '<span class="plus">+</span><span>Add your note</span>';
    card.addEventListener("click", openModal);
    return card;
  }

  // Listen for realtime updates
  let firstLoad = true;
  onValue(notesRef, (snapshot) => {
    board.innerHTML = "";
    const data = snapshot.val();
    if (!data) {
      board.innerHTML = '<p class="empty-msg">Be the first to sign! 🎂</p>';
    } else {
      const notes = Object.values(data).sort((a, b) => a.timestamp - b.timestamp);
      notes.forEach(n => board.appendChild(renderNote(n)));
    }
    board.appendChild(buildAddCard());
    if (firstLoad) {
      firstLoad = false;
      loading.classList.add("hidden");
    }
  });

  function openModal() {
    overlay.classList.add("open");
    nameInput.value = "";
    msgInput.value = "";
    selectedColor = Math.floor(Math.random() * noteColors.length);
    document.querySelectorAll(".swatch").forEach((s, i) => s.classList.toggle("selected", i === selectedColor));
    nameInput.focus();
  }
  function closeModal() { overlay.classList.remove("open"); }

  document.getElementById("cancelBtn").addEventListener("click", closeModal);
  overlay.addEventListener("click", e => { if (e.target === overlay) closeModal(); });

  submitBtn.addEventListener("click", async () => {
    const name    = nameInput.value.trim();
    const message = msgInput.value.trim();
    if (!name || !message) { showToast("Add your name and a note first"); return; }
    submitBtn.disabled = true;
    submitBtn.textContent = "Pinning…";
    try {
      await push(notesRef, {
        name, message,
        colorIndex: selectedColor,
        rotation: Math.floor(Math.random() * 10) - 5,
        timestamp: Date.now()
      });
      closeModal();
      showToast("Pinned! Thanks for signing 🎉");
    } catch(e) {
      showToast("Couldn't save — try again");
    }
    submitBtn.disabled = false;
    submitBtn.textContent = "Pin it";
  });

  document.getElementById("copyAllBtn").addEventListener("click", async () => {
    const snap = await new Promise(r => onValue(notesRef, r, { onlyOnce: true }));
    const data = snap.val();
    if (!data) { showToast("No messages yet"); return; }
    const text = Object.values(data).sort((a,b) => a.timestamp - b.timestamp).map(n => `${n.name}: ${n.message}`).join("\n\n");
    try { await navigator.clipboard.writeText(text); showToast("Copied all messages!"); }
    catch { showToast("Could not copy — select manually"); }
  });

  document.getElementById("exportBtn").addEventListener("click", async () => {
    const snap = await new Promise(r => onValue(notesRef, r, { onlyOnce: true }));
    const data = snap.val();
    if (!data) { showToast("No messages yet"); return; }
    const sorted = Object.values(data).sort((a,b) => a.timestamp - b.timestamp);
    const notesHtml = sorted.map(n => `<div class="note" style="background:${noteHex[n.colorIndex%6]};transform:rotate(${n.rotation}deg)"><div class="pin" style="background:${pinColors[n.colorIndex%6]}"></div><span class="msg">${escapeHtml(n.message)}</span><span class="from">— ${escapeHtml(n.name)}</span></div>`).join("\n");
    const snapshot = `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Thanks, Judy!</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
