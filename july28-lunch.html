<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lunch Time!</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f2044;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: sans-serif;
    color: #fff;
    text-align: center;
    padding: 20px;
  }
  img {
    width: 280px;
    max-width: 85vw;
    border-radius: 14px;
    box-shadow: 0 12px 36px rgba(0,0,0,0.5);
    margin-bottom: 24px;
  }
  p {
    font-size: 0.9rem;
    color: #6b8cc7;
    margin-top: 16px;
  }
  .bar-wrap {
    width: 220px;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    margin-top: 20px;
    overflow: hidden;
  }
  .bar {
    height: 100%;
    width: 0%;
    background: #e8b84f;
    border-radius: 2px;
    animation: fill 4s linear forwards;
  }
  @keyframes fill { to { width: 100%; } }
</style>
</head>
<body>
  <img src="https://fjcm-ej.github.io/lunch-calendar/lunch.gif" alt="lunch!">
  <p>Redirecting to your order...</p>
  <div class="bar-wrap"><div class="bar"></div></div>
<script>
  const params = new URLSearchParams(window.location.search);
  const dest = params.get('to');
  if (dest) {
    setTimeout(() => window.location.href = decodeURIComponent(dest), 4000);
  }
</script>
</body>
</html>
