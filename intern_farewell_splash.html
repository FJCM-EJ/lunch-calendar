  /* Soft vignette so card pops */
  .bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 30%, rgba(0,0,0,0.35) 100%);
  }

  /* Card */
  .card {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 2rem 1.5rem 1.8rem;
    max-width: 480px;
    width: 92vw;
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1.5px solid rgba(255,255,255,0.45);
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    animation: riseIn 0.7s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes riseIn {
    from { opacity:0; transform: translateY(30px) scale(0.97); }
    to   { opacity:1; transform: translateY(0) scale(1); }
  }

  /* Image carousel */
  .img-stack {
    position: relative;
    width: 210px;
    height: 210px;
    margin: 0 auto 1.4rem;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 10px 32px rgba(0,0,0,0.28);
  }
  .img-stack img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.7s ease;
  }
  .img-stack img.active { opacity: 1; }

  .pill {
    display: inline-block;
    background: rgba(10,22,40,0.65);
    color: #f5c842;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 4px 14px;
    border-radius: 100px;
    margin-bottom: 0.65rem;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.8rem, 10vw, 4.8rem);
    line-height: 0.9;
    color: #fff;
    text-shadow: 0 3px 12px rgba(0,0,0,0.4), 0 1px 0 rgba(0,0,0,0.6);
    letter-spacing: 0.02em;
    margin-bottom: 0.2em;
  }
  h1 span { color: #f5c842; }

  .names {
    font-size: 0.95rem;
    font-weight: 600;
    color: rgba(255,255,255,0.92);
    letter-spacing: 0.06em;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    margin-bottom: 1.4rem;
  }

  .farewell-note {
    font-size: 0.88rem;
    font-weight: 600;
    color: rgba(255,255,255,0.93);
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    line-height: 1.5;
    margin-bottom: 1.4rem;
    padding: 0 0.5rem;
  }

  /* Progress bar */
  .progress-wrap {
    background: rgba(255,255,255,0.25);
    border-radius: 100px;
    height: 5px;
    overflow: hidden;
    margin-bottom: 0.75rem;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #f5c842, #fff);
    border-radius: 100px;
    animation: fill 5s linear forwards;
  }
  @keyframes fill { to { width: 100%; } }

  .redirect-note {
    font-size: 0.75rem;
    color: rgba(255,255,255,0.65);
    letter-spacing: 0.03em;
  }

  /* Raining grad caps */
  .caps-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 5;
  }
  .cap {
    position: absolute;
    opacity: 0;
    animation: floatCap linear infinite;
  }
  @keyframes floatCap {
    0%   { opacity: 0; transform: translateY(-10vh) rotate(-20deg); }
    8%   { opacity: 0.85; }
    88%  { opacity: 0.7; }
    100% { opacity: 0; transform: translateY(110vh) rotate(30deg); }
  }
  .spark {
    position: absolute;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #f5c842;
    opacity: 0;
    animation: sparkle ease-in-out infinite;
  }
  @keyframes sparkle {
    0%,100% { opacity:0; transform:scale(0); }
    50%     { opacity:1; transform:scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, .progress-bar { animation: none !important; transition: none !important; }
    .progress-bar { width: 100%; }
    .card { animation: none; }
  }
</style>
</head>

  for (let i = 0; i < 18; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    s.style.left = (Math.random() * 100) + 'vw';
    s.style.top  = (Math.random() * 100) + 'vh';
    s.style.animationDuration = (1.2 + Math.random() * 2) + 's';
    s.style.animationDelay   = (Math.random() * 4) + 's';
    layer.appendChild(s);
  }

  const imgs = document.querySelectorAll('#imgStack img');
  let cur = 0;
  setInterval(() => {
    imgs[cur].classList.remove('active');
    cur = (cur + 1) % imgs.length;
    imgs[cur].classList.add('active');
  }, 1600);

  setTimeout(() => {
   const dest = new URLSearchParams(window.location.search).get('to');
  if (dest) window.location.href = decodeURIComponent(dest);
  }, 5000);
</script>
</body>
</html>
